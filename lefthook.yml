#                                                                                #
#                          Lefthook configuration file:                          #
#   This file is used to configure Lefthook, a tool for managing Git hooks.      #
#                                                                                #
#   https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md   #

$schema: https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json
assert_lefthook_installed: true
no_tty: false
min_version: "2.0.0"

# Hook commands run inside the devenv shell (see .lefthook/devenv-run.sh), so
# devenv-provided tools such as pnpm are available however git is invoked.
templates:
  devenv: .lefthook/devenv-run.sh

# Git caches an automatic merge's tree before this hook. If generation changes
# it, stop before committing; a subsequent git commit uses the regenerated index.
pre-merge-commit:
  commands:
    razorwind-merge:
      run: "{devenv} node tools/scripts/src/razorwind-merge.mjs --merge"

# This guard also runs with --no-verify, which skips the generation hooks.
prepare-commit-msg:
  commands:
    razorwind-merge:
      run: "{devenv} node tools/scripts/src/razorwind-merge.mjs --guard {2}"

# remotes:
#   - git_url: https://github.com/storm-software/storm-ops
#     ref: main
#     configs:
#       - packages/git-tools/src/lefthook/pnpm/recommended.yml

pre-commit:
  piped: true
  commands:
    razorwind-merge:
      priority: 1
      run: "{devenv} node tools/scripts/src/razorwind-merge.mjs --hook"
    nx-sync:
      glob: "**/*"
      run: "{devenv} pnpm nx sync"
      stage_fixed: true

pre-push:
  commands:
    nx-sync:
      glob: "**/*"
      run: "{devenv} pnpm nx sync"
      stage_fixed: true
